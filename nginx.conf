server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # No publicar la versión de nginx en las respuestas ni en las páginas de error.
  server_tokens off;

  # Tope del cuerpo: la API acepta hasta 5 MB de JSON (adjuntos en base64) y
  # 30 MB en las subidas con multipart. Sin este límite, nginx dejaba pasar
  # cuerpos arbitrariamente grandes hasta el backend.
  client_max_body_size 32m;
  client_body_timeout 30s;
  client_header_timeout 15s;

  # ── Cabeceras de seguridad de la SPA ──────────────────────────────────────
  # Antes no se enviaba ninguna: el portal se podía embeber en un iframe de otro
  # sitio (clickjacking sobre acciones de RR.HH.) y no había CSP que limitara de
  # dónde carga scripts la aplicación.
  #
  # La CSP permite 'unsafe-inline' en estilos porque la app usa `style=` en JSX;
  # los scripts, en cambio, salen todos del bundle propio ('self'), así que un
  # HTML inyectado no puede ejecutar código externo ni inline.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; frame-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;
  # HSTS: lo sirve Caddy en producción junto con el certificado. Se repite acá
  # por si este nginx queda expuesto directamente detrás de otro TLS.
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  # Proxy de la API al servicio "api" (red interna de docker-compose).
  location /api/ {
    proxy_pass http://api:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # La API ya manda sus propias cabeceras de seguridad y su Cache-Control.
    proxy_read_timeout 120s;
  }

  # OJO con la herencia de add_header en nginx: si un bloque `location` declara
  # CUALQUIER add_header propio, DESCARTA todos los heredados del nivel `server`.
  # Por eso acá no se usa add_header dentro de los location: el control de caché se
  # hace con la directiva `expires`, que no interfiere con la herencia.
  #   · expires -1  -> Cache-Control: no-cache (el HTML revalida en cada carga)
  #   · expires 1y  -> los assets llevan hash en el nombre, se pueden cachear
  location = /index.html {
    expires -1;
    try_files $uri =404;
  }

  location /assets/ {
    expires 1y;
    try_files $uri =404;
  }

  # Bloquea archivos ocultos y de respaldo que pudieran quedar copiados.
  location ~ /\. { deny all; }
  location ~ \.(sql|bak|env|log|old)$ { deny all; }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
